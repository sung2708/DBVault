name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Require an intentional stable SemVer tag and prepared changelog
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
          grep -F "## [$GITHUB_REF_NAME]" CHANGELOG.md
          test -z "$(gofmt -l cmd internal test)"
      - run: go mod verify
      - run: go mod tidy && git diff --exit-code -- go.mod go.sum
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...
      - run: go test -v -timeout=20m -tags=integration ./test/integration/...
  archives:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - linux/amd64
          - linux/arm64
          - darwin/amd64
          - darwin/arm64
          - windows/amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Build and package actual tag metadata
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          CGO_ENABLED: '0'
        run: |
          export GOOS="${TARGET%/*}" GOARCH="${TARGET#*/}"
          built="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          suffix=""; if [ "$GOOS" = windows ]; then suffix=.exe; fi
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=$GITHUB_REF_NAME -X main.commit=$GITHUB_SHA -X main.buildDate=$built" -o "dist/dbvault$suffix" ./cmd/dbvault
          cp LICENSE README.md dist/
          name="dbvault_${GITHUB_REF_NAME}_${GOOS}_${GOARCH}"
          if [ "$GOOS" = windows ]; then (cd dist && zip "$name.zip" "dbvault$suffix" README.md LICENSE); else tar -C dist -czf "dist/$name.tar.gz" "dbvault$suffix" README.md LICENSE; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ strategy.job-index }}
          path: |
            dist/*.zip
            dist/*.tar.gz
  publish:
    needs: archives
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: actions/checkout@v4
        with:
          path: source
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Attach release archives and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          (cd dist && sha256sum *.tar.gz *.zip > checksums.txt)
          previous="$(git -C source describe --tags --abbrev=0 "$GITHUB_SHA^")"
          python - "$GITHUB_REF_NAME" "$previous" source/CHANGELOG.md release-notes.md <<'PY'
          from pathlib import Path
          import re, sys

          version, previous, changelog, output = sys.argv[1:]
          lines = Path(changelog).read_text(encoding="utf-8").splitlines()
          heading = f"## [{version}]"
          active = False
          section = None
          sections = {}
          for line in lines:
              if line.startswith("## "):
                  if active:
                      break
                  active = line.startswith(heading)
                  continue
              if not active:
                  continue
              if line.startswith("### "):
                  section = line[4:].strip()
                  sections[section] = []
              elif section:
                  sections[section].append(line)
          categories = ("Added", "Changed", "Fixed", "Security", "Deprecated", "Removed", "Breaking Changes")
          populated = {name: "\n".join(rows).strip() for name, rows in sections.items() if name in categories and "\n".join(rows).strip()}
          if not populated:
              raise SystemExit(f"no prepared changelog entries found for {version}")
          highlights = []
          for name in categories:
              current = []
              items = []
              for line in populated.get(name, "").splitlines() + [""]:
                  if line.startswith("- "):
                      if current:
                          items.append(" ".join(current))
                      current = [line[2:].strip()]
                  elif current and line.startswith("  "):
                      current.append(line.strip())
                  elif current and not line.strip():
                      items.append(" ".join(current))
                      current = []
              for item in items:
                  sentence = re.search(r"^(.+?\.)\s", item)
                  highlights.append("- " + (sentence.group(1) if sentence else item))
              if len(highlights) >= 3:
                  break
          note = [f"# DBVault {version}", "", "This release packages the DBVault changes listed below with versioned binaries and checksums.", "", "## Highlights", "", *highlights[:3]]
          for name in categories:
              if name in populated:
                  title = "Breaking Changes" if name == "Breaking Changes" else name
                  note.extend(["", f"## {title}", "", populated[name]])
          note.extend(["", "## Installation", "", "### Via Go Install", "", "```bash", f"go install github.com/sung2708/DBVault/cmd/dbvault@{version}", "```", "", "### Pre-built Binaries", "", "Download the archive for your operating system and architecture from the Assets section below.", "", "### Verify Installation", "", "```bash", "dbvault version", "dbvault --help", "```", "", "Native PostgreSQL, MySQL and MongoDB client tools must be installed separately. SQLite requires no native executable.", "", "## Documentation", "", f"- [Getting Started](https://github.com/sung2708/DBVault/blob/{version}/docs/getting-started.md)", f"- [CLI Reference](https://github.com/sung2708/DBVault/blob/{version}/docs/cli-reference.md)", f"- [Configuration](https://github.com/sung2708/DBVault/blob/{version}/docs/configuration.md)", "", "## Checksums / Artifacts", "", "Verify the downloaded archive against `checksums.txt`:", "", "```bash", "sha256sum -c checksums.txt --ignore-missing", "```", "", "Archives contain the executable, README.md and LICENSE.", "", "## Full Changelog", "", f"https://github.com/sung2708/DBVault/compare/{previous}...{version}"])
          Path(output).write_text("\n".join(note) + "\n", encoding="utf-8")
          PY
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "DBVault $GITHUB_REF_NAME" --notes-file release-notes.md
