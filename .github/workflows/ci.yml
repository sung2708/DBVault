name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  checks:
    # MongoDB 8.0 rejects Linux kernels 6.19 through 7.0.13.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Formatting
        run: test -z "$(gofmt -l cmd internal test)"
      - run: go vet ./...
      - run: go mod verify
      - name: Module hygiene
        run: go mod tidy && git diff --exit-code -- go.mod go.sum
      - run: go test -coverprofile=coverage.out ./...
      - run: go test -race ./...
      - run: go run ./cmd/dbvault config --config configs/example.yaml
      - name: Installed CLI works outside the source tree
        run: |
          export GOBIN="$RUNNER_TEMP/dbvault-bin"
          go install ./cmd/dbvault
          cd "$RUNNER_TEMP"
          "$GOBIN/dbvault" --help
          "$GOBIN/dbvault" version --output json
          "$GOBIN/dbvault" update check --help
          "$GOBIN/dbvault" init --non-interactive --database sqlite --database-name ./init.db --storage local --config ./init.yaml --output json
          "$GOBIN/dbvault" config --config ./init.yaml
          "$GOBIN/dbvault" doctor --help
          DBVAULT_MONITOR_BINARY="$GOBIN/dbvault" python3 -B -m unittest discover -s "$GITHUB_WORKSPACE/scripts" -p test_monitor_backups.py -v
      - name: Database and cloud emulator backup-destroy-restore drills
        run: |
          mkdir -p .tmp-build
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o .tmp-build/dbvault-native-linux ./cmd/dbvault
          docker build -f Dockerfile.mysql-native-tools -t dbvault:native-mysql-tools .
          export DBVAULT_NATIVE_BINARY="$PWD/.tmp-build/dbvault-native-linux"
          go test -v -timeout=30m -tags=integration ./test/integration/...
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Known vulnerabilities in reachable code
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
  build:
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: windows
            arch: amd64
          - os: darwin
            arch: arm64
          - os: darwin
            arch: amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build ./cmd/dbvault
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
  containers:
    strategy:
      fail-fast: false
      matrix:
        # MongoDB 8.0 rejects Linux kernels 6.19 through 7.0.13.
        runner: [ubuntu-22.04, ubuntu-22.04-arm]
        target: [postgres, mysql, mongodb, sqlite]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          load: true
          tags: dbvault:smoke
          build-args: |
            VERSION=dev
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=smoke-${{ matrix.runner }}-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=smoke-${{ matrix.runner }}-${{ matrix.target }}
      - name: CLI and bundled native tools run as a non-root user
        shell: bash
        env:
          ENGINE: ${{ matrix.target }}
        run: |
          docker run --rm dbvault:smoke version --output json
          docker run --rm dbvault:smoke --help
          if [ "$ENGINE" != sqlite ]; then
            test "$(docker run --rm --entrypoint id dbvault:smoke -u)" != 0
            docker run --rm --entrypoint sh dbvault:smoke -ec '
              test ! -e /usr/local/bin/gosu
              if [ "$1" = mysql ]; then
                if command -v mysqlsh; then exit 1; fi
                test ! -d /usr/lib/mysqlsh
                for package in glibc glibc-common glibc-minimal-langpack; do
                  installed=$(rpm -q --qf "%{VERSION}-%{RELEASE}" "$package")
                  test "$(printf "%s\n" 2.34-284.0.1.el9_8.4 "$installed" | sort -V | head -1)" = 2.34-284.0.1.el9_8.4
                done
              elif [ "$1" = mongodb ]; then
                test ! -e /usr/bin/bsondump
                test ! -e /js-yaml.js
                test ! -d /opt/js-yaml
              fi
              if [ "$1" = mongodb ] || [ "$1" = postgres ]; then
                test "$(id -u)" = 999
                test "$(id -g)" = 999
                test "$(apk version -t "$(apk info -v | grep "^musl-" | sed s/musl-//)" 1.2.6-r3)" != "<"
                test "$(apk version -t "$(apk info -v | grep "^krb5-libs-" | sed s/krb5-libs-//)" 1.22.3-r0)" != "<"
                test ! -e /usr/bin/mongod
                test ! -e /usr/local/bin/postgres
              fi
            ' sh "$ENGINE"
            case "$ENGINE" in
              postgres) tools="pg_dump pg_restore psql pg_basebackup" ;;
              mysql) tools="mysqldump mysql mysqlbinlog" ;;
              mongodb) tools="mongodump mongorestore" ;;
            esac
            for tool in $tools; do docker run --rm --entrypoint "$tool" dbvault:smoke --version; done
          else
            test "$(docker image inspect --format '{{.Config.User}}' dbvault:smoke)" = 65532
          fi
      - name: Restore archives across upstream and packaged clients
        if: matrix.target == 'postgres' || matrix.target == 'mongodb'
        run: bash scripts/test-container-clients.sh ${{ matrix.target }} dbvault:smoke
