name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Formatting
        run: test -z "$(gofmt -l cmd internal test)"
      - run: go vet ./...
      - run: go mod verify
      - name: Module hygiene
        run: go mod tidy && git diff --exit-code -- go.mod go.sum
      - run: go test -coverprofile=coverage.out ./...
      - run: go test -race ./...
      - run: go run ./cmd/dbvault config --config configs/example.yaml
      - name: Installed CLI works outside the source tree
        run: |
          export GOBIN="$RUNNER_TEMP/dbvault-bin"
          go install ./cmd/dbvault
          cd "$RUNNER_TEMP"
          "$GOBIN/dbvault" --help
          "$GOBIN/dbvault" version --output json
          "$GOBIN/dbvault" update check --output json
          "$GOBIN/dbvault" init --non-interactive --database sqlite --database-name ./init.db --storage local --config ./init.yaml --output json
          "$GOBIN/dbvault" config --config ./init.yaml
          "$GOBIN/dbvault" doctor --help
          DBVAULT_MONITOR_BINARY="$GOBIN/dbvault" python3 -B -m unittest discover -s "$GITHUB_WORKSPACE/scripts" -p test_monitor_backups.py -v
      - name: Database and cloud emulator backup-destroy-restore drills
        run: |
          mkdir -p .tmp-build
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o .tmp-build/dbvault-native-linux ./cmd/dbvault
          docker build -f Dockerfile.mysql-native-tools -t dbvault:native-mysql-tools .
          export DBVAULT_NATIVE_BINARY="$PWD/.tmp-build/dbvault-native-linux"
          go test -v -timeout=30m -tags=integration ./test/integration/...
  build:
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: windows
            arch: amd64
          - os: darwin
            arch: arm64
          - os: darwin
            arch: amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./cmd/dbvault
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
  containers:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
        target: [postgres, mysql, mongodb, sqlite]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          load: true
          tags: dbvault:smoke
          build-args: |
            VERSION=dev
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=smoke-${{ matrix.runner }}-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=smoke-${{ matrix.runner }}-${{ matrix.target }}
      - name: CLI and bundled native tools run as a non-root user
        shell: bash
        env:
          ENGINE: ${{ matrix.target }}
        run: |
          docker run --rm dbvault:smoke version --output json
          docker run --rm dbvault:smoke --help
          if [ "$ENGINE" != sqlite ]; then
            test "$(docker run --rm --entrypoint id dbvault:smoke -u)" != 0
            case "$ENGINE" in
              postgres) tools="pg_dump pg_restore psql pg_basebackup" ;;
              mysql) tools="mysqldump mysql mysqlbinlog" ;;
              mongodb) tools="mongodump mongorestore" ;;
            esac
            for tool in $tools; do docker run --rm --entrypoint "$tool" dbvault:smoke --version; done
          else
            test "$(docker image inspect --format '{{.Config.User}}' dbvault:smoke)" = 65532
          fi
