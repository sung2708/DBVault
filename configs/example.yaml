version: "1"
database:
  type: postgres
  host: 127.0.0.1
  port: 5432
  user: postgres
  password_env: DB_PASSWORD
  database: dbvault_test
  ssl_mode: prefer
storage:
  type: local
  local:
    path: ./backups
    permissions: "0700"
compression:
  type: gzip
  level: 6
retention:
  keep_days: 30
  keep_count: 14
health:
  max_backup_age: 26h # Example daily SLA incl. dump duration/grace; set explicitly.
  backup_scope: logical
notifications:
  slack:
    enabled: false
    webhook_url_env: SLACK_WEBHOOK_URL
